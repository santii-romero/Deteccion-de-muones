name: Publicar informe de muones

on:
  push:
    branches: ['Análisis-laboratorio-de-enseñanzas']
    paths:
      - output/informe.html
      - output/pdf/proyecto_muones.pdf
      - results/report_manifest.json
      - scripts/prepare_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar el HTML y el PDF vigentes
        run: python3 scripts/prepare_pages.py --destination _site --revision "$GITHUB_SHA"
      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
